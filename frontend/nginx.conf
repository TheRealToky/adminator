server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route falls back to index.html.
    # NOTE: we deliberately omit `$uri/` from try_files. Vite builds hashed
    # static assets into `dist/assets/`, which collides with the in-app
    # `/assets` route — `$uri/` would match that directory, trigger nginx's
    # trailing-slash 301, and (because nginx listens on :80 inside the
    # container) the redirect Location strips the host's mapped port.
    # Hashed bundle files are still served by the static-asset location
    # below, which matches them by extension.
    location / {
        try_files $uri /index.html;
    }

    # Long-cache static assets (Vite emits hashed filenames)
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
