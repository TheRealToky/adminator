name: adminator

services:
  postgres:
    image: postgres:17-alpine
    container_name: adminator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - adminator-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adminator-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py seed --if-empty &&
        python manage.py seed_processed_materials --if-empty &&
        python manage.py runserver 0.0.0.0:8000
      "
    networks:
      - adminator-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${VITE_APP_NAME}
    container_name: adminator-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - adminator-net

  jupyter:
    build:
      context: ./notebooks
      dockerfile: Dockerfile
    container_name: adminator-jupyter
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-adminator-lab}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - adminator-net

volumes:
  postgres_data:
    name: adminator_postgres_data

networks:
  adminator-net:
    name: adminator-net
    driver: bridge
